services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: eduadcrm
      POSTGRES_USER: eduadcrm
      POSTGRES_PASSWORD: eduadcrm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eduadcrm
      MINIO_ROOT_PASSWORD: eduadcrm123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:

